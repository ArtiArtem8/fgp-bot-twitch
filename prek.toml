minimum_prek_version = "0.5.7"
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-fix",
    name = "Ruff safe fixes",
    entry = "uv run --locked ruff check --fix",
    language = "system",
    types = ["python"],
  },
  {
    id = "ruff-format",
    name = "Ruff format",
    entry = "uv run --locked ruff format",
    language = "system",
    types = ["python"],
  },
  {
    id = "gitleaks-staged",
    name = "Gitleaks staged",
    entry = "gitleaks git --staged --redact=100 --no-banner --ignore-gitleaks-allow",
    language = "system",
    pass_filenames = false,
    always_run = true,
  },
  {
    id = "ty",
    name = "ty",
    entry = "uv run --locked ty check",
    language = "system",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"]
  },
  {
    id = "deptry",
    name = "deptry",
    entry = "uv run --locked deptry .",
    language = "system",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"]
  },
  {
    id = "tach",
    name = "Tach",
    entry = "uv run --locked tach check",
    language = "system",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"]
  },
  {
    id = "unittest",
    name = "Parallel unittest",
    entry = "uv run --locked nose2 --no-user-config --plugin nose2.plugins.mp -N 6 -s tests -t . -q",
    language = "system",
    pass_filenames = false,
    always_run = true,
    stages = ["pre-push"]
  }
]
