name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.18"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26"
          cache: false
      - name: Install and sync locked Python environment
        run: uv sync --locked
      - name: Install standalone audit tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          uv tool install zizmor==1.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check lockfile
        run: uv lock --check
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: ty
        run: uv run --locked ty check
      - name: deptry
        run: uv run --locked deptry .
      - name: Tach
        run: uv run --locked tach check
      - name: unittest with branch coverage
        run: |
          uv run --locked coverage run -m unittest discover -s tests -t . -v
          uv run --locked coverage report
          uv run --locked coverage json -o - | uv run --locked python -c "import json,sys; v=json.load(sys.stdin)['totals']['percent_branches_covered']; print('Branch coverage: %.1f%% (minimum 75.0%%)' % v); sys.exit(v < 75.0)"
      - name: Dependency audit
        run: uv audit --frozen
      - name: Gitleaks repository history
        run: gitleaks git . --log-opts="--all --full-history" --redact=100 --no-banner --ignore-gitleaks-allow
      - name: GitHub Actions correctness
        run: actionlint
      - name: GitHub Actions security
        run: zizmor --pedantic .github/workflows
