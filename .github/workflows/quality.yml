name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static quality and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.18"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Install and sync locked Python environment
        run: uv sync --locked
      - name: Install standalone audit tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          uv tool install zizmor==1.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check lockfile
        run: uv lock --check
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: deptry
        run: uv run --locked deptry .
      - name: Tach
        run: uv run --locked tach check
      - name: Dependency audit
        run: uv audit --frozen
      - name: Gitleaks repository history
        run: gitleaks git . --log-opts="--all --full-history" --redact=100 --no-banner --ignore-gitleaks-allow
      - name: GitHub Actions correctness
        run: actionlint
      - name: GitHub Actions security
        run: zizmor --pedantic .github/workflows

  runtime:
    name: Runtime (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            ty-platform: win32
          - label: Linux
            os: ubuntu-latest
            ty-platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.18"
      - name: Sync locked environment
        run: uv sync --locked
      - name: Type check target platform
        shell: bash
        env:
          TY_PLATFORM: ${{ matrix.ty-platform }}
        run: uv run --locked ty check --python-platform "$TY_PLATFORM"
      - name: unittest with branch coverage
        run: |
          uv run --locked coverage erase
          uv run --locked coverage run -m unittest discover -s tests -t . -v
          uv run --locked coverage report
          uv run --locked coverage json -o coverage.json
          uv run --locked python -c "import json,sys; v=json.load(open('coverage.json', encoding='utf-8'))['totals']['percent_branches_covered']; print('Branch coverage: %.1f%% (minimum 76.0%%)' % v); sys.exit(v < 76.0)"
