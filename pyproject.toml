[project]
name = "fgp-bot-twitch"
version = "2.0.0"
description = "Local single-channel Twitch bot with explicit readiness and end-to-end checks"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.13.3,<4",
    "python-dotenv>=1.2.2,<2",
]

[tool.uv]
package = false
required-version = ">=0.11.18,<0.12"

[dependency-groups]
dev = [
    "coverage[toml]",
    "deptry",
    "ruff",
    "tach",
    "ty",
]

[tool.ruff]
target-version = "py314"
line-length = 99
preview = true
force-exclude = true
respect-gitignore = true
show-fixes = true
unsafe-fixes = false

[tool.ruff.lint]
select = ["ALL"]
# Ruff's formatter conflicts with these rules; D203 also conflicts with D211.
ignore = [
    "tab-indentation", "indentation-with-invalid-multiple", "indentation-with-invalid-multiple-comment", "over-indented", "incorrect-blank-line-before-class", "docstring-tab-indentation", "triple-single-quotes",
    "multi-line-summary-second-line", "bad-quotes-inline-string", "bad-quotes-multiline-string", "bad-quotes-docstring", "avoidable-escaped-quote", "unnecessary-escaped-quote", "missing-trailing-comma", "prohibited-trailing-comma",
    # The MIT LICENSE applies to the repository; per-file notices duplicate it.
    "missing-copyright-notice",
    # This is an application, not a public library. Method names and class-level
    # contracts are clearer than mandatory one-line restatements for each method.
    "undocumented-public-method", "undocumented-public-init", "undocumented-magic-method",
    # Localized error text is intentionally written at the raise site; moving
    # each message into a one-use variable or exception class adds boilerplate.
    "raw-string-in-exception", "f-string-in-exception", "raise-vanilla-args",
    # Annotations state return types; high-level docstrings explain behavior,
    # without repeating every return and raised branch in Sphinx sections.
    "docstring-missing-returns", "docstring-missing-exception",
    # Some try blocks deliberately catch locally raised protocol/sentinel errors
    # to normalize failures or guarantee cleanup; helper extraction adds no safety.
    "raise-within-try",
]

[tool.ruff.lint.per-file-ignores]
# unittest cases are named executable specifications, not pytest tests or public APIs.
"tests/**/*.py" = ["pytest-unittest-assertion", "pytest-composite-assertion", "pytest-unittest-raises-assertion", "undocumented-public-module", "undocumented-public-class", "undocumented-public-function", "assert", "private-member-access", "magic-value-comparison"]
# These modules intentionally print user-facing Russian text in the console.
"fgpbot/auth.py" = ["print", "ambiguous-unicode-character-string"]
"fgpbot/cli.py" = ["print", "ambiguous-unicode-character-string"]
"fgpbot/commands.py" = ["ambiguous-unicode-character-string"]
"fgpbot/config.py" = ["ambiguous-unicode-character-string"]
"fgpbot/tokens.py" = ["ambiguous-unicode-character-string"]
"fgpbot/health.py" = ["import-outside-top-level"] # msvcrt/fcntl exist on different OSes.
# aiohttp/WebSocket and decoded JSON are dynamic external API boundaries.
"fgpbot/eventsub.py" = ["any-type"]
"fgpbot/network.py" = ["any-type"]
"fgpbot/twitch.py" = ["any-type"]
# The notification fixture exposes independent wire fields; grouping them
# would make individual protocol scenarios harder to read.
"tests/helpers.py" = ["too-many-arguments"]
# This fake HTTP endpoint intentionally returns each protocol case directly.
"tests/test_integration.py" = ["too-many-return-statements"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 4
max-branches = 10
max-returns = 5
max-statements = 40
max-locals = 12
max-nested-blocks = 4
max-bool-expr = 4

[tool.ty.src]
include = ["fgpbot", "tests", "main.py"]

[tool.ty.environment]
python-version = "3.14"
python-platform = "win32"

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"
division-by-zero = "warn"
possibly-missing-attribute = "warn"
possibly-missing-import = "warn"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
respect-type-ignore-comments = false

[tool.ty.terminal]
error-on-warning = true

[tool.deptry]
known_first_party = ["fgpbot", "tests"]

[tool.coverage.run]
branch = true
source = ["fgpbot"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 85.0
