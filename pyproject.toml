[project]
name = "fgp-bot-twitch"
version = "2.0.0"
description = "Local single-channel Twitch bot with explicit readiness and end-to-end checks"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiohttp>=3.13.3,<4",
  "python-dotenv>=1.2.2,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
