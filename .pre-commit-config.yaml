repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-fix
        name: Ruff safe fixes
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      - id: gitleaks-staged
        name: Gitleaks staged
        entry: gitleaks git --pre-commit --staged --redact=100 --no-banner --ignore-gitleaks-allow
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ty
        name: ty
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: deptry
        name: deptry
        entry: uv run --locked deptry .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: tach
        name: Tach
        entry: uv run --locked tach check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: unittest
        name: unittest
        entry: uv run --locked python -m unittest discover -s tests -t . -v
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
